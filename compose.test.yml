name: ipsakti-test
services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ipsakti_test
      POSTGRES_PASSWORD: ipsakti_test
      POSTGRES_DB: ipsakti_test
    ports:
      - "55432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ipsakti_test -d ipsakti_test"]
      interval: 2s
      timeout: 3s
      retries: 20

  qdrant:
    image: qdrant/qdrant:v1.12.1
    ports:
      - "56333:6333"
      - "56334:6334"
    tmpfs:
      - /qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333'"]
      interval: 2s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20
